artifacts:
  # ============================================================
  # haus v0.4.0: LoRaWAN + Loxone climate history in one place.
  # Decided with the owner 2026-11-12.
  # ============================================================

  # --- Project ---
  - id: REQ-NAME-001
    type: requirement
    title: The project, crates and binary are named haus
    status: implemented
    release: v0.4.0
    description: >
      loriot-websocket-mcp becomes haus. LORIOT (LoRaWAN) and Loxone are
      sources inside it. The version line continues at 0.4.0 so existing
      deployments see one continuous history.
    fields:
      priority: must
      category: constraint

  - id: REQ-TRACE-001
    type: requirement
    title: Artifacts are tracked with rivet and validated in CI
    status: verified
    release: v0.4.0
    description: >
      Requirements, decisions, the STPA analysis and tests live in artifacts/
      and `rivet validate` runs in CI on every pull request, with rivet taken
      from the varve-pinned layer.
    fields:
      priority: must
      category: constraint

  # --- Data model and storage ---
  - id: REQ-MODEL-001
    type: requirement
    title: One data model for every source
    status: verified
    release: v0.4.0
    description: >
      Readings are stored as source → sensor → series. A sensor has a source
      (loriot, loxone), a stable source id (EUI, UUID), a room and a display
      name. Series kinds include temperature, humidity, battery voltage, motion,
      and heating state: valve position, room controller state, pump state.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-004

  - id: REQ-STORE-001
    type: requirement
    title: The full history is stored durably and queried without stalling
    status: verified
    release: v0.4.0
    description: >
      All points of all series are kept on disk. Range queries read only the
      requested range; no request reads the whole history, and no file IO runs
      on the async runtime.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-006

  - id: REQ-RES-001
    type: requirement
    title: Resource budget on a Raspberry Pi 4 class host
    status: implemented
    release: v0.4.0
    description: >
      With about 10M stored points, haus stays under 512 MB of memory on a
      Raspberry Pi 4 class host, and a 90-day chart page renders in under 1 s
      there. Measured on that hardware, not on a laptop.
    fields:
      evidence: >
        On the deployment host (Raspberry Pi 4 class), 2026-11-13/14. Store:
        8,363,292 points in 62 series (LoRaWAN 302,365, Loxone 8,060,927;
        2025-01-03 to 2026-11-14), counted on a copy of that store by two
        methods that agreed. 0.4.0-rc.7 ran 25 h without restart: peak RSS
        (VmHWM) 75.1 MiB, RSS 41.7 MiB at the end. 0.4.0-rc.8 on the same
        store: 15 requests for 90-day sensor pages (whole page, chart drawn
        on the server) took 0.031 to 0.163 s through the reverse proxy,
        timed from the LAN. The store holds 8.4M points, not 10M; memory is
        at 15 % of the budget and the slowest page at 16 % of its limit.
      priority: must
      category: non-functional
    links:
      - type: constraint-satisfies
        target: SC-006

  # --- Import ---
  - id: REQ-IMPORT-001
    type: requirement
    title: Import the LoRaWAN history with a count check
    status: verified
    release: v0.4.0
    description: >
      `haus import loriot <sensor_history.jsonl>` stores every reading. It fails
      if the per-device, per-field count stored differs from the count in the
      file. Re-running it stores nothing twice.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-001

  - id: REQ-IMPORT-002
    type: requirement
    title: Import the Stats4Lox export with a count check
    status: verified
    release: v0.4.0
    description: >
      `haus import stats4lox <dir>` reads a Stats4Lox InfluxDB export
      (manifest.json plus <measurement>/<YYYY-MM>.jsonl.gz), keys each series by
      the point's `uuid` and field, skips telegraf `internal_*` measurements
      and measurements whose points carry no `uuid` (Miniserver diagnostics
      such as `stats_miniserver`), naming every skipped measurement in its
      report, and fails if
      the stored count per measurement and field differs from the manifest's
      `influx_counts`. Points already stored (same uuid and timestamp) are not
      stored again, so a later delta export can be imported over the full one.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-001
      - type: constraint-satisfies
        target: SC-004

  # --- Live sources ---
  - id: REQ-LORIOT-001
    type: requirement
    title: LORIOT websocket ingestion keeps its current guarantees
    status: verified
    release: v0.4.0
    description: >
      The existing client's behaviour carries over: bounded handshake and
      writes, ping every 30 s, a connection silent for 75 s counts as dead,
      reconnect with exponential backoff and jitter.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-007

  - id: REQ-LOX-001
    type: requirement
    title: Live Loxone values from the Miniserver websocket
    status: verified
    release: v0.4.0
    description: >
      haus connects to the Miniserver's websocket with token authentication,
      enables binary status updates, and stores value events for the state
      UUIDs of the configured sensors: every series a Stats4Lox logger still
      records, unless retired on purpose in LOXONE_MAP (series a logger
      stopped recording, or that are not room measurements), each named at
      startup as mapped, unmapped or retired. Events for UUIDs not
      configured are ignored.
      Verified here against an in-process fake Miniserver implementing the
      V17.0 protocol; that every real series maps to a state is checked on
      the deployment against the real Miniserver (startup log line
      "N of M series mapped", /health), so this stays implemented until then.
    fields:
      evidence: >
        0.4.0-rc.7 and rc.8 on the deployment against the real
        Miniserver, 2026-11-13/14: startup logs "Loxone: 38 of 47 series
        mapped to states, 9 retired" (none unmapped); /health reports the
        Loxone source connected with values seconds old; the warnings rules
        run on the live Loxone series (4 stuck sensors and 2 cold rooms
        found and confirmed by the operator).
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-004
      - type: constraint-satisfies
        target: SC-007

  - id: REQ-LOX-002
    type: requirement
    title: The Miniserver connection is read-only and its credentials secret
    status: verified
    release: v0.4.0
    description: >
      Credentials come only from the service's environment file. They never
      appear in
      logs, pages, API responses or URLs. haus sends no command that changes
      a control's state.
    fields:
      priority: must
      category: constraint
    links:
      - type: constraint-satisfies
        target: SC-005

  - id: REQ-LOX-003
    type: requirement
    title: The Miniserver connection recovers and reports its state
    status: verified
    release: v0.4.0
    description: >
      Keep-alive, silent-connection detection, token refresh and reconnect with
      backoff, as for LORIOT.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-007

  - id: REQ-LOX-005
    type: requirement
    title: Loxone sensors without imported history can be followed
    status: verified
    release: v0.4.0
    description: >
      Controls listed in LOXONE_TRACK are followed live although no history
      was imported for them (sensors added after a logger stopped, or never
      logged). Their series take name, room and quantity from the
      Miniserver's structure file.
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-LOX-001

  - id: REQ-HEALTH-001
    type: requirement
    title: /health reports every source
    status: verified
    release: v0.4.0
    description: >
      GET /health answers 200 while the process lives and carries, per source,
      connected and last_message_at, so a watchdog or a monitor can see a dead
      source without restarting the service in a loop.
    fields:
      priority: must
      category: interface
    links:
      - type: constraint-satisfies
        target: SC-007

  # --- Dashboard ---
  - id: REQ-UI-001
    type: requirement
    title: Overview of all rooms
    status: verified
    release: v0.4.0
    description: >
      One page lists every room with its latest temperature, humidity and
      heating state, each with its age, grouped by room across sources.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003

  - id: REQ-UI-002
    type: requirement
    title: Sensor detail with trends
    status: verified
    release: v0.4.0
    description: >
      Per sensor, server-rendered SVG trends for 1 h, 24 h, 7 d and 90 d,
      bucketed to a fixed number of columns, with a gap drawn as a break.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003

  - id: REQ-UI-003
    type: requirement
    title: Health page for sensors and sources
    status: verified
    release: v0.4.0
    description: >
      Connection state per source, last value age per sensor, battery voltage
      and status for battery-powered sensors.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003
      - type: constraint-satisfies
        target: SC-007

  - id: REQ-UI-004
    type: requirement
    title: The dashboard builds without wasm or npm
    status: verified
    release: v0.4.0
    description: >
      Pages are rendered by the server; the only browser script is vendored htmx
      (and SSE). The release builds with cargo alone.
    fields:
      priority: must
      category: constraint

  - id: REQ-UI-008
    type: requirement
    title: Served under a path prefix behind a reverse proxy
    status: verified
    release: v0.4.0
    description: >
      With HAUS_BASE_PATH set (e.g. /haus), every page, partial, static file,
      API and SSE route answers under that prefix and every URL a page
      generates points there, so a reverse proxy can forward /haus/* with the
      prefix kept. /health also stays at the root. Without the setting
      nothing moves. A malformed prefix stops startup.
    fields:
      evidence: >
        0.4.0-rc.8 on the deployment behind its reverse proxy with
        HAUS_BASE_PATH=/haus, 2026-11-14: the overview, status, sensor pages,
        /haus/api/* and /haus/health answer under the prefix; the proxy
        forwards /haus/* with the prefix kept, and /api/* outside it is not
        haus's.
      priority: must
      category: functional
    links:
      - type: traces-to
        target: REQ-UI-001

  - id: REQ-UI-009
    type: requirement
    title: Home link and app switcher (nav v1)
    status: verified
    release: v0.4.0
    description: >
      With HAUS_NAV (a nav v1 JSON file, the contract shared with warte:
      `warte docs nav`, docs/topics/nav.md at pulseengine/warte
      ec989cb, v1.6.25) and HAUS_NAV_SELF (haus's id in it) set, every page
      header shows a link home and one link per app in file order, haus's
      own marked aria-current, exactly 1 + apps links, URLs as given. A file
      that breaks the contract, or only one of the two settings, stops
      startup naming the field. Unset, pages are unchanged.
    fields:
      evidence: >
        0.4.0-rc.8 on the deployment with the host's nav v1 file,
        2026-11-14, checked through the reverse proxy: the haus page shows
        5 app links (home, warte, haus, photos, login) in file order with
        aria-current only on haus; warte 1.6.25 on the same file shows the
        same 5 links in the same order with aria-current on warte. A broken
        copy of the file stopped both apps at startup naming apps[2].url.
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-UI-001

  # --- Release and retirement ---
  - id: REQ-DEPLOY-001
    type: requirement
    title: A signed linux-arm64 release that deployment tooling can verify
    status: approved
    release: v0.4.0
    description: >
      Tags build static binaries with SHA256SUMS.txt signed by cosign (keyless,
      release workflow identity) and an SBOM, as for 0.3.0, so deployment
      tooling can verify the release and pin the binary's sha256.
    fields:
      priority: must
      category: constraint

  - id: REQ-RETIRE-001
    type: requirement
    title: Compare haus against a Stats4Lox logger it replaces
    status: verified
    release: v0.4.0
    description: >
      `haus compare stats4lox <dir>` reports, per series, whether haus's value
      at each Stats4Lox sample time agrees with the exported value. haus
      receives every change while Stats4Lox samples on a fixed interval, so
      the comparison is by value at sample time, not by count. Together with
      the delta import of REQ-IMPORT-002 this is the evidence an operator needs
      before switching a Stats4Lox logger off.
    fields:
      priority: must
      category: constraint
    links:
      - type: constraint-satisfies
        target: SC-002
      - type: traces-to
        target: REQ-IMPORT-002

  # --- Out of scope for v0.4.0 (recorded so the decision is visible) ---
  - id: REQ-MCP-001
    type: requirement
    title: MCP query interface
    status: draft
    description: >
      Dropped by the owner on 2026-11-12; the unwired src/mcp_server.rs is
      removed in v0.4.0.
    release: backlog
    fields:
      priority: wont
      category: interface

  - id: REQ-UI-005
    type: requirement
    title: Weather, heat pump, thermal, forecast and energy pages
    status: draft
    description: >
      The 0.3.0 dashboard's other pages return one per release after v0.4.0,
      rebuilt in the server-rendered style.
    release: backlog
    fields:
      priority: could
      category: functional

  - id: REQ-WOHL-001
    type: requirement
    title: Feed readings to wohl's monitors
    status: draft
    description: >
      A later release publishes temperature and humidity streams to
      pulseengine/wohl so its monitors can alert (freeze, overheat, humidity).
    release: backlog
    fields:
      priority: could
      category: interface

  # --- Later: wireless M-Bus meters (heat meters, heat cost allocators) ---
  - id: REQ-WMBUS-001
    type: requirement
    title: Wireless M-Bus meters as a source
    status: draft
    description: >
      haus reads wireless M-Bus meters through wmbusmeters' JSON output
      (stdout or MQTT): heat meters (energy in kWh, current and previous
      billing period) and heat cost allocators (consumption units, room and
      radiator temperature where the meter sends them). Series are keyed by
      manufacturer and meter id. Meter ids and AES keys come only from the
      deployment's configuration. A telegram that cannot be decoded (no
      driver, or encrypted without a key) is counted and reported per meter
      on the health page, never dropped silently.
    release: backlog
    fields:
      priority: could
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-004
      - type: constraint-satisfies
        target: SC-007

  - id: REQ-TECHEM-001
    type: requirement
    title: Monthly consumption from the Techem tenant portal
    status: draft
    description: >
      Optional cross-check for the billing-relevant monthly values (kWh,
      allocator units, m3) that the Techem tenant portal shows. There is no
      public API; access would follow the browser login (OAuth2 with PKCE and
      a refresh token) that community clients use, so it may break whenever
      the portal changes. Only after REQ-WMBUS-001, and only if the radio path
      leaves a gap.
    release: backlog
    fields:
      priority: could
      category: interface
    links:
      - type: traces-to
        target: REQ-WMBUS-001

  # --- Backlog: house view, labels, shared Loxone protocol (owner, 2026-11-12) ---
  - id: REQ-UI-006
    type: requirement
    title: A 3D view of the house with sensors in their rooms
    status: approved
    release: v0.5.0
    description: >
      A page shows the building level by level (levels can be shown alone or
      exploded), the rooms of each level, and each sensor in the room it
      measures, coloured by its current value. Beyond the owner's rooms it
      shows the rest of the building (other units and shared rooms as
      neutral floors), outdoor areas such as terraces with the devices the
      home controller lists for them, an optional shell of walls and roofs,
      and the surroundings (parcel, streets, neighbouring buildings, trees),
      with fixed viewpoints. Labels never cover each other. The house model
      (levels, rooms, polygons, massing, site, sensor placement) is a file
      on the deployment (HAUS_HOUSE_MODEL); it is private and never part of
      this repository, which carries only the viewer and a made-up example
      model.
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-008

  - id: REQ-UI-007
    type: requirement
    title: Readable sensor labels
    status: draft
    release: backlog
    description: >
      Labels come from what the sources say a sensor is (the Loxone structure
      file's control name, room and category; devices.json for LoRaWAN),
      without repeating the quantity or the room ("Temperature · Kitchen"
      rather than "Temperature · Temperatur Küche"), and can be overridden
      per series.
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-UI-001

  - id: REQ-LOX-004
    type: requirement
    title: One Loxone protocol implementation shared with mcp-loxone
    status: draft
    release: backlog
    description: >
      The Miniserver protocol pieces (token authentication, command
      encryption, message framing, event tables, structure file) move into
      a crate that haus and avrabe/mcp-loxone both use, so a protocol fix
      lands once.
    fields:
      priority: could
      category: constraint
    links:
      - type: traces-to
        target: REQ-LOX-001

  # --- Warnings (owner, 2026-11-12: into v0.4.0) ---
  - id: REQ-WARN-001
    type: requirement
    title: Warnings for values that need attention
    status: verified
    release: v0.4.0
    description: >
      haus evaluates its current data and shows warnings on the room overview
      (on the room's card), on the status page (all warnings), and as JSON at
      GET /api/warnings. Each warning names its kind, room, series and
      since when it holds. Thresholds come from an optional HAUS_WARNINGS
      JSON file with defaults, overridable per room; rooms can be declared
      outdoor (no climate warnings) or frost-only (cellar, garage).
    fields:
      priority: must
      category: functional
    links:
      - type: constraint-satisfies
        target: SC-003

  - id: REQ-WARN-002
    type: requirement
    title: Mould risk
    status: verified
    release: v0.4.0
    description: >
      A room whose humidity stays at or above the threshold (default 65 %)
      for the whole window (default 4 h) gets a mould-risk warning. A value
      that held from before the window counts (Loxone sends only changes).
    fields:
      priority: must
      category: functional
    links:
      - type: traces-to
        target: REQ-WARN-001

  - id: REQ-WARN-003
    type: requirement
    title: Too cold and too warm
    status: verified
    release: v0.4.0
    description: >
      A room's current air temperature below the cold threshold (default
      16 °C; frost rooms: default 3 °C) or above the warm threshold (default
      26 °C) gets a warning. Floor probes, radiator and valve temperatures
      are not room air and never count.
    fields:
      priority: must
      category: functional
    links:
      - type: traces-to
        target: REQ-WARN-001

  - id: REQ-WARN-004
    type: requirement
    title: Silent sensors and sources, low batteries
    status: verified
    release: v0.4.0
    description: >
      A LoRaWAN sensor without a value for longer than the silence threshold
      (default 60 min), a source that is not connected, and a battery voltage
      below the threshold (default 2.6 V) each get a warning. A silent sensor
      gets one warning naming all of its series, not one per series.
    fields:
      priority: must
      category: functional
    links:
      - type: traces-to
        target: REQ-WARN-001

  - id: REQ-WARN-005
    type: requirement
    title: Heating anomaly
    status: verified
    release: v0.4.0
    description: >
      A valve in a room open at or above the threshold (default 50 %) for the
      whole window (default 2 h) while the room's air temperature rose less
      than the minimum (default 0.3 K) gets a warning. (Heating with a window
      open needs window states haus does not record yet; later.)
    fields:
      priority: should
      category: functional
    links:
      - type: traces-to
        target: REQ-WARN-001

  - id: REQ-WARN-006
    type: requirement
    title: Stuck Loxone sensors
    status: implemented
    release: v0.4.0
    description: >
      A Loxone temperature or humidity whose value has not changed for the
      stuck threshold (default 72 h) gets a warning, and its value takes no
      part in the room's temperature, mould and heating rules. The
      Miniserver repeats the last value of a sensor that stopped sending (an
      empty battery), so without this rule an old value looks current and
      can raise a false warning. The value standing before the evaluation
      window counts, however old. Only series the source follows live are
      judged, by this and every other rule: a retired or unmapped Loxone
      series keeps an old stored value while the sensor itself may change.
    fields:
      priority: must
      category: functional
    links:
      - type: traces-to
        target: REQ-WARN-001
