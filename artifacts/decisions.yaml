artifacts:
  - id: DD-001
    type: design-decision
    title: Pin the toolchain to varve's covalent realm
    status: verified
    description: >
      Toolchain from the varve covalent layer; rivet comes from it locally and in CI.
    release: v0.4.0
    fields:
      decision: >
        varve.toml pins realm `covalent` (channel rolling); varve-realms.toml
        carries the pulseengine, pulseengine-wasm and covalent roots. CI gets
        rivet from the pinned layer.
      rationale: >
        One pin gives both the traceability tools (rivet, spar, witness) and
        the component-model tools, each verified against its own realm root,
        so a later move to WebAssembly components (for example toward wohl)
        needs no second pin.
      alternatives: >
        Pin the pulseengine realm only (enough for rivet today); install rivet
        with cargo (unsigned, unpinned).
    links:
      - type: satisfies
        target: REQ-TRACE-001

  - id: DD-002
    type: design-decision
    title: Server-rendered htmx dashboard, as warte does it
    status: verified
    description: >
      Pages rendered on the server with htmx and SSE; trends as server-drawn SVG; no wasm or npm.
    release: v0.4.0
    fields:
      decision: >
        axum handlers render HTML from include_str! templates; vendored htmx
        2.0.4 (sha256 equal to the published file) re-fetches the overview
        partial every 30 s; trends are SVG paths drawn on the server over 240
        columns, restarting the path after every gap (after
        pulseengine/warte src/dashboard, charts.rs). An empty column repeats
        the last value while it is younger than the source's hold (LoRaWAN
        30 min, Loxone 24 h, as Loxone sends only changes) and is a gap after
        that. The overview leaves out series silent for over 30 days; the
        status page lists everything, oldest first. The loriot-web crate
        (Leptos, trunk, tailwind, npm) is removed. Polling instead of SSE: one
        request every 30 s per open page, and no second script.
      rationale: >
        One binary with no wasm or node toolchain in the build or the release;
        the page is a function of the stored data, so a test can assert what a
        page shows. Same pattern as pulseengine/warte.
      alternatives: >
        Keep Leptos (CSR wasm, needs trunk and npm in CI and a separate asset
        tarball); a JS charting library (gap handling is the library's, not
        ours).
    links:
      - type: satisfies
        target: REQ-UI-001
      - type: satisfies
        target: REQ-UI-002
      - type: satisfies
        target: REQ-UI-003
      - type: satisfies
        target: REQ-UI-004

  - id: DD-003
    type: design-decision
    title: redb as the time-series store
    status: verified
    description: >
      One embedded redb file holds every series, keyed by series id and timestamp.
    release: v0.4.0
    fields:
      decision: >
        One redb file. Key (series id, timestamp), value the reading; a series
        table maps source ids (UUID, EUI) to series ids. Writes are batched;
        reads and writes run on blocking threads.
      rationale: >
        A multi-year Loxone history is millions of points; the 0.3.0 store (an
        append-only JSONL read in full for every history query) cannot serve
        range queries on that within 512 MB on a Pi. redb is pure Rust, embedded, one file,
        and is what warte uses for its machine history (REQ-MHIST-001 there).
        Measured 2026-11-12 with crates/haus-core/examples/store_bench.rs on a
        developer Mac (NOT the target): 7M points written in 6.9 s, 257 MiB
        file (38.5 bytes/point), 77 MB peak RSS with a 32 MiB page cache, a
        90-day read of one 5-minute series 1.8 ms. To be confirmed by
        REQ-RES-001's measurement on the target hardware with the same example.
      alternatives: >
        SQLite (sqlx); keep InfluxDB on another host (the dependency being
        retired); JSONL per month with an index.
    links:
      - type: satisfies
        target: REQ-STORE-001
      - type: satisfies
        target: REQ-RES-001

  - id: DD-004
    type: design-decision
    title: Live Loxone data straight from the Miniserver websocket
    status: verified
    description: >
      Live Loxone values come from the Miniserver websocket directly, not from a logger in between.
    release: v0.4.0
    fields:
      decision: >
        haus speaks the Miniserver websocket protocol itself, after Loxone's
        "Communicating with the Loxone Miniserver" V17.0 (31.3.2026): the
        public key fetched over HTTP(S) before the websocket is opened (a real
        Miniserver, 17.2, answers getPublicKey with 400 on the websocket), RSA
        key exchange and an AES-256-CBC session, token authentication (getkey2,
        getjwt with permission 4, authwithtoken, refreshjwt) with the token
        kept in a 0600 file, the structure file, enablebinstatusupdate, and
        value-event tables keyed by UUID. Token commands are always sent
        encrypted: V17.0 says getjwt must be (unencrypted is declined with 400)
        and also that encryption is optional since 11.2 with TLS; encrypting
        works either way. Series map to state UUIDs through the structure
        file: field Default is the control's `value` state; other fields
        (e.g. a room controller's outputs) through a LOXONE_MAP override file.
        RSA uses the rsa 0.9 crate for encryption only, so RUSTSEC-2023-0071
        (a timing leak in decryption) does not apply.
      rationale: >
        Reading the Miniserver directly needs no logger (LoxBerry with
        Stats4Lox and InfluxDB) between it and haus, and gives every change
        rather than periodic samples.
      alternatives: >
        Poll a Stats4Lox InfluxDB (keeps that logger in the chain);
        poll the Miniserver's HTTP /jdev/sps/io API (no events, one request per
        state).
    links:
      - type: satisfies
        target: REQ-LOX-001
      - type: satisfies
        target: REQ-LOX-003
      - type: satisfies
        target: REQ-RETIRE-001

  - id: DD-005
    type: design-decision
    title: Loxone series are identified by UUID
    status: verified
    description: >
      Loxone series are keyed by the control UUID carried in every exported point and live event.
    release: v0.4.0
    fields:
      decision: >
        Every Stats4Lox point carries the Loxone `uuid` of its source; the
        import keys series by it and the live client subscribes to the same
        UUIDs, so history and live data join without matching names.
      rationale: >
        Stats4Lox measurement names are display names that are renamed and
        de-duplicated with suffixes (`Temperature_2`);
        a UUID is stable.
      alternatives: Match by measurement name; a hand-written name map.
    links:
      - type: satisfies
        target: REQ-IMPORT-002
      - type: satisfies
        target: REQ-LOX-001
      - type: satisfies
        target: REQ-MODEL-001

  - id: DD-006
    type: design-decision
    title: Count checks in the import, as the export did
    status: verified
    description: >
      Every import ends with a per-series count comparison against its source and fails on a difference.
    release: v0.4.0
    fields:
      decision: >
        Each import ends by counting what it stored per series and field and
        comparing with the source (the JSONL itself; the manifest's
        influx_counts), exiting non-zero on any difference.
      rationale: >
        The export carries InfluxDB's own count(field) per measurement;
        checking the import against it keeps the chain closed from InfluxDB
        to haus.
      alternatives: Spot-check a few series by hand.
    links:
      - type: satisfies
        target: REQ-IMPORT-001
      - type: satisfies
        target: REQ-IMPORT-002

  - id: DD-007
    type: design-decision
    title: Stay separate from wohl, feed it later
    status: draft
    release: backlog
    fields:
      decision: >
        haus remains its own collector and dashboard; integration with
        pulseengine/wohl is a later release that publishes streams to it.
      rationale: >
        wohl's monitors expect its own CCSDS sensor nodes; haus's job is
        ingesting existing LoRaWAN and Loxone sources. Owner decision
        2026-11-12.
      alternatives: Fold haus into wohl as its ingestion and dashboard.
    links:
      - type: satisfies
        target: REQ-WOHL-001

  - id: DD-008
    type: design-decision
    title: v0.4.0 scope is the core, under the name haus
    status: verified
    description: >
      v0.4.0 ships the core pages only under the new name; MCP is removed; other pages return later.
    release: v0.4.0
    fields:
      decision: >
        Rename to haus; remove the unwired MCP server; ship overview, sensor
        detail and health pages only; the 0.3.0 weather, heat pump, thermal,
        forecast and energy pages come back one per release.
      rationale: >
        Owner decisions 2026-11-12. The release's value is all climate data in
        one place; every extra page is a rewrite to the
        server-rendered style that does not move that.
      alternatives: Port all eleven 0.3.0 pages before releasing; keep MCP.
    links:
      - type: satisfies
        target: REQ-NAME-001
      - type: satisfies
        target: REQ-MCP-001
      - type: satisfies
        target: REQ-UI-005

  - id: DD-009
    type: design-decision
    title: Keep the 0.3.0 release pipeline
    status: implemented
    description: >
      The 0.3.0 release pipeline (static binaries, SBOM, cosign-signed sums) carries over.
    release: v0.4.0
    fields:
      decision: >
        release.yml keeps building static musl binaries, a CycloneDX SBOM and
        SHA256SUMS.txt with a keyless cosign bundle; only names change and the
        assets tarball goes away (the pages are in the binary).
      rationale: >
        Existing deployment tooling already verifies exactly this shape against
        the release workflow identity; v0.3.0 was deployed that way.
      alternatives: Move to sigil-signed releases now.
    links:
      - type: satisfies
        target: REQ-DEPLOY-001

  - id: DD-010
    type: design-decision
    title: wmbusmeters decodes the radio, haus consumes its JSON
    status: draft
    release: backlog
    fields:
      decision: >
        A wM-Bus USB receiver (an IMST iU891A/iU893A-class stick, C1+T1)
        is driven by wmbusmeters, which runs as its own process; haus
        subscribes to its JSON telegrams. haus does not decode wM-Bus itself.
      rationale: >
        wmbusmeters carries maintained drivers for the meters in question
        (vario451 for Techem Vario 4 heat meters, fhkvdataiii/iv for Techem
        heat cost allocators) and the receiver support. Keeping it a separate
        process keeps its GPL-3.0 code out of haus's MIT binary and lets the
        receiver sit on another host than haus if radio range needs it.
      alternatives: >
        Decode wM-Bus in Rust inside haus (re-implements every driver);
        the Techem tenant portal only (monthly, per apartment, fragile login).
    links:
      - type: satisfies
        target: REQ-WMBUS-001

  - id: DD-011
    type: design-decision
    title: Keep the 0.3.0 LORIOT client and generalise its health state
    status: verified
    release: v0.4.0
    description: >
      The LORIOT websocket client stays as it is; its connection state becomes
      one entry of a per-source health table that the Loxone client also fills.
    fields:
      decision: >
        websocket.rs keeps its injectable timings, ping/pong and backoff. The
        shared upstream state turns into a map source → {connected,
        last_message_at}, which /health and the health page render.
      rationale: >
        The 0.3.0 client was hardened against a real dead-socket hang and has
        tests for it (silent peer, quiet upstream that answers pings); rewriting
        it would throw that evidence away.
      alternatives: A generic source trait with one reconnect loop for both.
    links:
      - type: satisfies
        target: REQ-LORIOT-001
      - type: satisfies
        target: REQ-HEALTH-001

  - id: DD-012
    type: design-decision
    title: The Miniserver client sends only an allow-listed set of commands
    status: verified
    release: v0.4.0
    description: >
      Every command the Loxone client can send is a constant in one list
      (key exchange, token, enable status updates, keep-alive, refresh);
      credentials are read from the environment once and held in a type
      without Debug or Display output.
    fields:
      decision: >
        The client has no API that takes a free-form command string. A test
        asserts the set of commands it can emit equals the allow-list. The
        Miniserver's public key is pinned (LOXONE_KEY_SHA256, else trusted on
        first use and remembered in the token file); a different key is
        refused before anything derived from the credentials is sent, so a
        host on a plain ws:// path cannot read the session and relay or
        brute-force the login.
      rationale: >
        Reading needs only the handful of session commands; making anything
        else unrepresentable is cheaper to check than reviewing every call
        site, and keeps the credentials out of logs by construction.
      alternatives: Reuse a general-purpose Loxone client library.
    links:
      - type: satisfies
        target: REQ-LOX-002

  - id: DD-013
    type: design-decision
    title: Retire and track Loxone series through configuration
    status: verified
    release: v0.4.0
    description: >
      LOXONE_MAP marks a series retired with "-"; LOXONE_TRACK lists
      controls to follow without history. One state may feed several series.
    fields:
      decision: >
        A retired series keeps its history, is not followed live and is
        reported as retired rather than unmapped. A tracked control gets a
        series (field Default, its value state) with name, room and category
        from the structure file. A state that several series map to feeds
        all of them, instead of the last mapping silently winning.
      rationale: >
        On the deployment 10 of 38 series did not map: some were recorded by
        the logger only until early 2025, some are not room measurements, one
        logger field moved (Default to AQ) after one evening. The owner
        decided per series (2026-11-12); configuration states those decisions
        and the startup line makes them visible. New sensors added after the
        logger stopped would otherwise never be followed.
      alternatives: >
        Ignore unmapped series (silent); discover every climate control
        automatically (would also pick up displays and actuators that show
        temperatures, as the deployment's structure file has).
    links:
      - type: satisfies
        target: REQ-LOX-001
      - type: satisfies
        target: REQ-LOX-005

  - id: DD-014
    type: design-decision
    title: Warnings are evaluated on request from the store
    status: verified
    release: v0.4.0
    description: >
      A pure evaluator over each series' latest value and a recent window;
      pages and /api/warnings call it. No state, no notifications.
    fields:
      decision: >
        haus_core::warn evaluates rules over series metadata, recent points and
        source connection state at a given time. Room air temperature is the
        median of the room's air-temperature series (floor probes, radiator
        and valve temperatures excluded by name patterns, configurable).
        Notifications stay out of haus; wohl's alert dispatcher is where they
        belong (REQ-WOHL-001).
      rationale: >
        Stateless evaluation can be tested as a function of data and time, and
        shows the same thing on every page. Data and pages are the system of
        record; notification needs dedup and rate limits wohl already has.
      alternatives: A background evaluator with stored alert state; push notifications from haus.
    links:
      - type: satisfies
        target: REQ-WARN-001
      - type: satisfies
        target: REQ-WARN-002
      - type: satisfies
        target: REQ-WARN-003
      - type: satisfies
        target: REQ-WARN-004
      - type: satisfies
        target: REQ-WARN-005
      - type: satisfies
        target: REQ-WARN-006
      - type: traces-to
        target: REQ-WOHL-001

  - id: DD-015
    type: design-decision
    title: Path prefix kept by the proxy, pages link relative to a base href
    status: implemented
    release: v0.4.0
    description: >
      haus mounts its routes under HAUS_BASE_PATH and pages carry
      <base href="{prefix}/"> with relative links.
    fields:
      decision: >
        The router is nested under the prefix ({prefix} and {prefix}/ both
        serve the overview); /health is served at the root and under the
        prefix. The page template is the only place that names the prefix:
        links, static files and htmx requests are relative and resolve
        against <base href>. The proxy forwards the path unchanged
        (Caddy `handle /haus/*`, not `handle_path`).
      rationale: >
        With the prefix kept, the URL haus sees is the URL the browser
        used, so redirects, cookie paths and OIDC callback URLs for a later
        login are right without proxy headers; direct access on the port
        and access through the proxy show the same links.
      alternatives: >
        Proxy strips the prefix and haus only rewrites links (pages then
        break on direct access, and a login callback must be told the
        outside path); X-Forwarded-Prefix per request (depends on the proxy
        setting it and on trusting it).
    links:
      - type: satisfies
        target: REQ-UI-008

  - id: DD-016
    type: design-decision
    title: App switcher from a shared nav v1 file, contract owned by warte
    status: implemented
    release: v0.4.0
    description: >
      haus reads the operator's nav v1 file once at startup and renders it
      into the page header; the contract text lives in warte.
    fields:
      decision: >
        haus_core::nav parses and checks the file exactly as warte's contract
        says (version 1, no unknown keys, name/id/url/desc limits, 1 to 20
        apps, self among the ids) and renders "← home" plus every app, the
        own entry as a link with aria-current. The HTML is built once at
        startup and inserted at a {{NAV}} mark in the page template; unset,
        the mark becomes empty and the page is unchanged. URLs are
        site-absolute or https and are written as given, so the <base href>
        of the path prefix does not affect them.
      rationale: >
        One file for every app on the host, written by the operator from the
        same list as the landing page; identical checks in both apps mean a
        file works everywhere or nowhere. haus runs warte's 24 refusal cases
        (tests/nav.rs at pulseengine/warte ec989cb) as its own test, plus
        the rules warte added for v1.7.0: no backslash in any URL ("/\\x"
        is read as "//x" by browsers), file, home and apps must be JSON
        objects (serde accepts an array as a positional struct), version is
        the integer 1, duplicate keys are refused, "desc": null is no
        description, lengths count code points, a type error names its
        field. Types are checked on a serde_json::Value before the typed
        parse, which is the one that refuses duplicate keys.
      alternatives: >
        Links from environment variables per app; a switcher served by the
        reverse proxy (needs response rewriting).
    links:
      - type: satisfies
        target: REQ-UI-009

  - id: DD-017
    type: design-decision
    title: 3D house view from a private model file, drawn with vendored three.js
    status: implemented
    release: v0.5.0
    description: >
      haus reads the operator's house model (HAUS_HOUSE_MODEL) once at
      startup and serves a /house page that draws it in the browser with
      three.js, each room coloured by its current air temperature.
    fields:
      decision: >
        haus_core::house parses and checks a house model v1 (levels, rooms
        with plan polygons and the haus rooms whose sensors they hold, other
        units, buildings with walls and flat/gable/hip/barrel roofs, site,
        viewpoints; unknown keys and out-of-range values refused naming the
        field). GET /api/house returns the model and, per room, the climate
        computed by warn::climate with the warning rules (only series followed
        live, stuck and silent ones left out, no floor or radiator probes,
        medians), its series and its warnings; the page refreshes it every
        minute. three.js 0.160.0 (module, OrbitControls, CSS2DRenderer) is
        vendored from the npm tarball whose sha512 matched the registry,
        pinned by sha256 in a test, and loaded through an import map that
        names only files haus serves. The header links to /house only when a
        model is configured; without one every other page is unchanged.
      rationale: >
        A floor plan with live colours answers "where is it too cold or too
        damp" at a glance, and the owner approved the look from a private
        preview. The model describes a real home, so it stays deployment data
        like every home detail; the repository carries the viewer and a made-up example.
        Computing the colour with the warning rules means the view and the
        warnings never disagree about a room.
      alternatives: >
        A server-rendered SVG floor plan (no 3D, no shell or surroundings);
        three.js from a CDN (a runtime dependency on a third party and a
        privacy leak from the household's browsers); WebGL by hand (far more
        code to own).
    links:
      - type: satisfies
        target: REQ-UI-006
      - type: satisfies
        target: REQ-UI-004

  - id: DD-018
    type: design-decision
    title: Labels from the source name without room and quantity, overridable per series
    status: implemented
    release: v0.5.0
    description: >
      The room overview, the sensor page and the house view label a series
      "<quantity> · <sensor>", where the sensor part is what the source name
      says beyond the room and the quantity.
    fields:
      decision: >
        haus_core::label::short removes from the source's name the room's
        words (as a whole word sequence, any case) and the words that only
        restate the quantity (German and English, e.g. Temperatur,
        Luftfeuchte, Ventil), then separators left at either end; when nothing
        is left only the quantity shows. HAUS_LABELS, an optional JSON file
        {"<uuid or EUI>/<field>": "label"} keyed like LOXONE_MAP, sets the
        sensor part of any series and wins over the derived one; a bad file
        stops startup naming the key. The source name itself is unchanged in
        the store, the warnings and the status page, and the house view shows
        it as the link's title.
      rationale: >
        The page already says the room (card heading) and the quantity (first
        word), so repeating them is noise; what is left is what tells two
        sensors in a room apart ("Touch Spiegel", "Fußboden"). The warning
        rules match not_air patterns against the source name, so that name
        must stay the one stored.
      alternatives: >
        Building labels from the structure file's category (Loxone names its
        categories per installation, so it says little); renaming series in
        the store (names are display data that may change; series identity is the source id); labels
        only from an operator file (every new sensor would need an entry).
    links:
      - type: satisfies
        target: REQ-UI-007

  - id: DD-019
    type: design-decision
    title: The tour runs in the page, warnings interleaved, nothing on the server
    status: implemented
    release: v0.5.0
    description: >
      The tour, the alert strip and full screen are client-side additions to
      house3d.js; the server only adds the controls to the page.
    fields:
      decision: >
        The tour visits the rooms with sensors, top floor first; every
        fourth step is an overview from the model's next viewpoint, jittered
        so it never repeats exactly, and OrbitControls' autoRotate drifts the
        camera slowly while nobody touches the view. When rooms have alarms,
        every other room step is the next alarmed room, so an alarm is never
        more than two steps away and the other rooms still come up. The minute refresh compares the warned rooms before and
        after and flies to a new one at once. The camera eases towards the
        room keeping its viewing direction (at least 40 degrees from
        above), the floors above the room are hidden and walls and roofs
        switched off; stopping restores the floor checkboxes. A warned room
        glows in its own colour (emissive = its colour, pulsing), because a
        red tint would read as another temperature; the meaning is carried
        by red labels and the alert strip. Full screen uses the Fullscreen
        API on the view and is hidden where unsupported (iPhone Safari).
        ?tour=<s> collapses the panel and starts the tour: a browser in
        kiosk mode on a wall screen needs nothing else.
      rationale: >
        A wall screen should show the house without anyone touching it, and
        a problem should not wait for its turn in a long round. Doing it in
        the page keeps the server and its API unchanged.
      alternatives: >
        Visiting only warned rooms while any exist (the other rooms would
        never show during a long-lasting warning, such as a stuck sensor);
        a red overlay on warned rooms (changes the temperature colour); a
        separate kiosk page (a second page to keep in step with the view).
    links:
      - type: satisfies
        target: REQ-UI-010
      - type: satisfies
        target: REQ-UI-006

  - id: DD-020
    type: design-decision
    title: Checks and alarms told apart by kind, short text computed where labels are known
    status: implemented
    release: v0.5.0
    description: >
      warn::Kind::is_check marks the kinds about a sensor or source; the
      haus crate words them short for the room cards and the house view.
    fields:
      decision: >
        SensorStuck, SensorSilent, BatteryLow and SourceDown are checks; the
        rest are alarms. dashboard::short_text words a check as "Check
        <label>: no change|no data for <span>" or "battery low", with the
        readable sensor label (else the source name) and the span
        from since_ms; an alarm keeps its message. /api/house carries both
        message and short plus check; the status page and /api/warnings are
        unchanged. A room card is marked only by an alarm; in the house view
        only alarms come first in the tour, pulse and jump in when new,
        while checks get a calm chip and an outlined label.
      rationale: >
        A stuck or silent sensor is something to look at when convenient,
        not a problem in the room; worded and styled like an alarm it hides
        the alarms. The labels live in the haus crate, so the short text is
        built there rather than in haus-core.
      alternatives: >
        A severity field in every Warning (a schema change for all
        consumers of /api/warnings); shortening the messages themselves (the
        status page needs the detail).
    links:
      - type: satisfies
        target: REQ-UI-011

  - id: DD-021
    type: design-decision
    title: warte's idle scene reused, weather fetched by the server
    status: implemented
    release: v0.5.0
    description: >
      crates/haus/assets/idle.js is warte's templates/idle.js at eb27b67
      (Apache-2.0, same author) with marked changes; the weather comes from
      the Miniserver's weather service, else a small server-side Open-Meteo
      client.
    fields:
      decision: >
        The script is taken over, not rewritten, so the two apps' scenes stay
        alike; the changes are marked "haus:" in it: settings from a JSON
        script element (#idle-cfg), drawing into the house view (the
        Fullscreen API shows only that element), the weather from
        api/weather, and facts from api/house. The server rounds the place
        to 0.1 degree before it leaves the house, asks every 30 minutes with
        a 15 s timeout, keeps the last answer and serves it while under 3 h
        old; a failure is logged, and the page then simply has no weather.
        A test keeps outside URLs out of both scripts.
      rationale: >
        The owner wanted warte's scene in the house view, and the house page
        talks to nothing but haus (REQ-UI-004); a server-side fetch keeps
        that rule and sends Open-Meteo only a rounded place, once per 30
        minutes for the whole household.
      alternatives: >
        The browser asking Open-Meteo as in warte (an outside request from
        every page, with the time zone's city); weather only from the
        house's own outdoor sensors (no rain or snow).
    links:
      - type: satisfies
        target: REQ-UI-012
      - type: satisfies
        target: REQ-UI-004

  - id: DD-022
    type: design-decision
    title: A web app manifest instead of more full-screen code
    status: implemented
    release: v0.5.0
    description: >
      Full screen on iPad browsers comes from installing the page, not from
      script; haus serves a manifest and two PNG icons from the binary.
    fields:
      decision: >
        static/manifest.webmanifest (display fullscreen, display_override
        fullscreen then standalone, scope the haus root, no start_url),
        icon-180.png and icon-512.png (the favicon's house, drawn into the
        binary), and the apple-mobile-web-app tags with the default status
        bar. house?tour also turns on the fill-the-window view, so a wall
        tablet started from the home screen shows only the house.
      rationale: >
        iPadOS lets no page hide the browser's bars, and all iPad browsers
        are WebKit; an installed web app opens without them.
      alternatives: >
        A native wrapper app (a second thing to build and update); Guided
        Access alone (locks the tablet but keeps the browser bars).
    links:
      - type: satisfies
        target: REQ-UI-013

  - id: DD-023
    type: design-decision
    title: Weather from the Loxone Weather Service, drawn in the scene in the browser
    status: implemented
    release: v0.5.0
    description: >
      haus reads the weather service's binary weather tables on its existing
      Miniserver websocket; the 3D view draws sun, sky and precipitation
      from /api/weather with three.js only.
    fields:
      decision: >
        haus_core::loxone parses weather-state tables (identifier 7) as
        "Communicating with the Loxone Miniserver" (Config 10.0) lays them
        out: uuid, lastUpdate u32, nrEntries i32, 68-byte entries of five
        i32 and six f64, little endian; weather_server reads the structure
        file's weatherServer (actual, forecast, weatherTypeTexts). The
        session keeps the actual state's first entry as the current weather,
        with the type's text; wmo_from turns the text (German or English)
        into a WMO code so both sources draw alike. /api/weather prefers the
        Miniserver's answer while under 3 h old. The browser computes the
        sun's azimuth and elevation (place from the scene's settings, else
        the time zone's city), turns them by the model's north_deg, and sets
        the sun light, its colour and the background from it; rain is line
        segments, snow points, in a box around the buildings, moved each
        frame by gravity and the wind.
      rationale: >
        The owner's Miniserver has the weather service, and the owner prefers
        it to an outside request with coordinates. Drawing in the browser
        keeps the server's work to one small JSON answer.
      alternatives: >
        Open-Meteo only (an outside request and a place to configure); a
        weather station (none is installed); shadows (too heavy for a wall
        tablet).
    links:
      - type: satisfies
        target: REQ-UI-014
      - type: satisfies
        target: REQ-UI-012

  - id: DD-024
    type: design-decision
    title: A floor probe stands in for a room without an air sensor
    status: implemented
    release: v0.5.0
    description: >
      warn::climate falls back to the room's floor-heating probes when it
      has no air sensor, and marks the value as from the floor.
    fields:
      decision: >
        When no followed, fresh, not-stuck air sensor is left in a room, the
        room's floor probes (names with Fußboden, Fussboden, FBH or Floor)
        give its temperature, median as usual, and Climate.floor is set;
        the house view says "floor" on the label and "(floor probe)" in the
        info box. Radiator probes and valve actuators never stand in. The
        warning rules are unchanged: a floor probe raises no too-cold or
        too-warm alarm.
      rationale: >
        Owner, 2026-11-14, about the study: its only temperature is the
        floor-heating probe, which sits close to the room's air, so its value
        is better than a grey room. Marking it keeps the difference visible.
      alternatives: >
        Keeping such rooms grey (the owner found that unhelpful); following
        the room controller's actual temperature (fed from the same probe
        there); treating floor probes as air everywhere (wrong where the
        room has a real air sensor).
    links:
      - type: satisfies
        target: REQ-UI-006
