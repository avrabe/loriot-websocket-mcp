name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in step with release.yml.
  RUST_TOOLCHAIN: 1.96.1
  # varve itself; the tools (rivet) come from the layer varve.toml pins.
  VARVE_VERSION: v0.47.0

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # The workspace no longer enables haus-core's weather HTTP features
      # (async, blocking); lint and test them here so that code keeps building
      # until the weather page returns (REQ-UI-005).
      - name: cargo clippy (haus-core, all features)
        run: cargo clippy -p haus-core --all-targets --all-features --locked -- -D warnings

      - name: cargo test (haus-core, all features)
        run: cargo test -p haus-core --all-features --locked

      - name: cargo test
        run: cargo test --workspace --locked

  # Traceability: rivet from the varve layer this repo pins (varve.toml), so CI
  # validates with exactly the rivet a developer gets. varve is installed from
  # its release with the checksum file's cosign signature checked first.
  # rivet: verifies REQ-TRACE-001
  # rivet: verifies DD-001
  rivet:
    name: rivet validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install varve (verified)
        run: |
          cd "$RUNNER_TEMP"
          B="https://github.com/pulseengine/varve/releases/download/${VARVE_VERSION}"
          curl -fsSLO "$B/install.sh"
          curl -fsSLO "$B/SHA256SUMS.txt"
          curl -fsSLO "$B/SHA256SUMS.txt.cosign.bundle"
          cosign verify-blob \
            --bundle SHA256SUMS.txt.cosign.bundle \
            --certificate-identity-regexp '^https://github\.com/pulseengine/varve/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            SHA256SUMS.txt
          sha256sum -c --ignore-missing SHA256SUMS.txt | grep -qx './install.sh: OK'
          VARVE_INSTALL_DIR="$RUNNER_TEMP/varve/bin" sh install.sh --version "$VARVE_VERSION"
          echo "$RUNNER_TEMP/varve/bin" >> "$GITHUB_PATH"

      - name: Install the pinned layer
        run: |
          varve --version
          varve install
          varve which rivet

      - name: rivet validate
        run: varve run -- rivet validate
