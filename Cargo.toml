[workspace]
resolver = "2"
members = [
    "crates/loriot-core",
    "crates/loriot-server",
    "crates/loriot-web",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/avrabe/loriot-websocket-mcp"

[workspace.dependencies]
# Shared dependencies across workspace
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "std"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }
tracing = "0.1"
fxhash = "0.2"
