[package]
name = "haus-core"
version.workspace = true
edition.workspace = true
description = "Core types and logic for haus: sensor decoding, storage, analytics"
license.workspace = true

[features]
default = []
# Enable async HTTP for weather fetching (server-side)
async = ["reqwest/json", "zip", "tokio"]
# Enable blocking HTTP for weather fetching (CLI tools)
blocking = ["reqwest/blocking", "reqwest/json", "zip"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "std"] }
fxhash = "0.2"
thiserror = "2.0"
hex = "0.4"
urlencoding = "2.1"
# Time-series store (DD-003)
redb = "4.5"
# Stats4Lox export files are gzip (REQ-IMPORT-002)
flate2 = "1"
# Loxone Miniserver protocol (REQ-LOX-001, DD-004). The 0.9/0.8/0.12
# generation: the 0.10 line reworked its API. RSA is used only to encrypt
# with the Miniserver's public key, so RUSTSEC-2023-0071 (a timing leak in
# decryption) does not apply.
rsa = "0.9"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"

# Optional dependencies for weather module
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"], optional = true }
zip = { version = "2.2", default-features = false, features = ["deflate"], optional = true }
tokio = { version = "1", features = ["sync"], optional = true }

