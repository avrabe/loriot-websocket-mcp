[build]
# The index HTML file to drive the bundling
target = "index.html"
# The output directory for all final assets
dist = "../../assets"

[watch]
# Watch the following paths for changes
watch = ["src", "index.html", "../../style"]

[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "cd ../.. && npm run css:build 2>/dev/null || true"]
