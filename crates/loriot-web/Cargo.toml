[package]
name = "loriot-web"
version = "0.1.0"
edition = "2021"
description = "Leptos web frontend for LoRaWAN sensor monitoring"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "loriot-web"
path = "src/main.rs"

[dependencies]
loriot-core = { path = "../loriot-core" }

leptos = { version = "0.7" }
leptos_meta = { version = "0.7" }
leptos_router = { version = "0.7" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde", "std"] }

# Client-side dependencies
gloo-net = { version = "0.6", optional = true }
gloo-timers = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = ["EventSource", "MessageEvent", "SvgsvgElement", "DomRect", "MouseEvent", "Blob", "Url", "Document", "HtmlElement", "Window"] }
js-sys = { version = "0.3", optional = true }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["csr"]
csr = ["leptos/csr", "gloo-net", "gloo-timers", "wasm-bindgen", "web-sys", "js-sys", "console_error_panic_hook"]
hydrate = ["leptos/hydrate", "gloo-net", "gloo-timers", "wasm-bindgen", "web-sys", "js-sys", "console_error_panic_hook"]
ssr = ["leptos/ssr"]
