[package]
name = "haus"
version.workspace = true
edition.workspace = true
description = "haus: home climate history from LoRaWAN and Loxone, with a web dashboard"
license.workspace = true

[[bin]]
name = "haus"
path = "src/main.rs"

[dependencies]
haus-core = { path = "../haus-core" }

# Web framework
axum = { version = "0.8", features = ["ws"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# The Loxone public key comes over HTTP(S), not the websocket.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde", "std"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
fastrand = "2.0"
tokio-stream = { version = "0.1", features = ["sync"] }
bytes = "1.9"

[dev-dependencies]
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
hex = "0.4"
tower = { version = "0.5", features = ["util"] }
